spring.application.name=findmyplot-hero

# Use Local H2 Database (File-based for persistence)
spring.datasource.url=jdbc:h2:file:./data/findmyplot
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Create database if it doesn't exist
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Security Configuration
app.jwt.secret=your_very_long_and_very_secure_secret_key_that_is_at_least_32_characters_long
app.jwt.expiration-ms=86400000

# CORS Configuration (to allow React to talk to Spring Boot)
spring.mvc.cors.allowed-origins=http://localhost:5173


